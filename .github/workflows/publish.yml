# Publishes to pub.dev when a version tag is pushed, e.g.
#   git tag v2.0.0 && git push origin v2.0.0
# The tag must match `version` in pubspec.yaml. pub.dev only accepts this workflow because
# "Automated publishing" is enabled on the package's admin page for this repository with the
# tag pattern v{{version}}.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # pub.dev authenticates this workflow with a GitHub OIDC token
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Requests the short-lived pub.dev token, so it runs right before publishing.
      - uses: dart-lang/setup-dart@v1
      - run: flutter pub publish --force
