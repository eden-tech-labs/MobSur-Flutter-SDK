name: mobsur_flutter_sdk
description: Show MobSur in-app surveys in your Flutter app when your users reach the moments you choose.
version: 2.0.0
homepage: https://mobsur.com
repository: https://github.com/eden-tech-labs/MobSur-Flutter-SDK

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  http: ">=0.13.5 <2.0.0"
  package_info_plus: ">=4.0.0 <11.0.0"
  shared_preferences: ^2.2.0
  webview_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: ^2.6.0
